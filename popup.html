<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Transactions</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body data-theme="light">
    <header>
        <div>
            <h1>Credit Karma Extractor</h1>
            <p class="header-subtitle">Export transactions and wealth data to CSV</p>
        </div>
        <div class="theme-toggle" id="theme-toggle" title="Toggle Dark Mode">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </div>
    </header>

    <main>
        <section class="card date-card">
            <h3 class="section-title">Date Range</h3>
            <div class="input-row">
                <div class="input-group">
                    <label for="start-date">Start</label>
                    <input type="date" id="start-date">
                </div>
                <div class="input-group">
                    <label for="end-date">End</label>
                    <input type="date" id="end-date">
                </div>
            </div>
            <div class="quick-dates">
                <button class="pill-btn" data-range="ytd">YTD</button>
                <button class="pill-btn" data-range="last-month">Last Month</button>
                <button class="pill-btn" data-range="last-year">Last Year</button>
            </div>
        </section>

        <section class="card">
            <h3 class="section-title">Choose Your Export</h3>
            <label class="bundle-option checkbox-label checkbox-label-wide">
                <input type="checkbox" id="budgetLensBundleCheckbox" checked>
                <span>
                    BudgetLens Bundle
                    <small>Recommended · 1 JSON file with transactions and all wealth data</small>
                </span>
            </label>

            <div class="section-divider"></div>
            <p class="group-label">Transactions</p>
            <div class="grid-columns transaction-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="allTransactionsCheckbox"> All Transactions
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="incomeCheckbox"> Income
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="expensesCheckbox"> Expenses
                </label>
            </div>

            <div class="section-divider"></div>
            <p class="group-label">Net Worth</p>
            <div class="wealth-options">
                <label class="checkbox-label checkbox-label-wide">
                    <input type="checkbox" id="netWorthCheckbox">
                    <span>
                        Complete Net Worth
                        <small>3 files: total history, current categories, and account sources</small>
                    </span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="investmentsCheckbox">
                    <span>
                        Investment History
                        <small>Investment total over time</small>
                    </span>
                </label>
                <label class="checkbox-label checkbox-label-wide">
                    <input type="checkbox" id="wealthAccountsCheckbox">
                    <span>
                        Current Snapshot Only
                        <small>2 files: current categories and account sources; no date range needed</small>
                    </span>
                </label>
            </div>
        </section>

        <section class="card">
            <h3 class="section-title">Transaction Columns</h3>
            <p class="group-label">CSV exports only</p>
            <div class="column-grid">
                <label class="checkbox-label"><input type="checkbox" id="col-date" checked> Date</label>
                <label class="checkbox-label"><input type="checkbox" id="col-desc" checked> Desc</label>
                <label class="checkbox-label"><input type="checkbox" id="col-amount" checked> Amount</label>
                <label class="checkbox-label"><input type="checkbox" id="col-category" checked> Category</label>
                <label class="checkbox-label"><input type="checkbox" id="col-type" checked> Type</label>
                <label class="checkbox-label"><input type="checkbox" id="col-account" checked> Account</label>
                <label class="checkbox-label"><input type="checkbox" id="col-notes" checked> Notes</label>
                <label class="checkbox-label"><input type="checkbox" id="col-labels" checked> Labels</label>
            </div>
        </section>

        <details class="advanced card">
            <summary>Advanced</summary>
            <label class="toggle-row" title="Uses Credit Karma's API for faster, deeper exports.">
                <span>
                    <strong>Use Fast API</strong>
                    <small>Recommended</small>
                </span>
                <span class="toggle-switch">
                    <input type="checkbox" id="useApiCheckbox" checked>
                    <span class="slider"></span>
                </span>
            </label>
            <button id="debug-raw-btn" class="secondary-btn"
                title="Downloads raw GraphQL responses for troubleshooting.">
                Export Raw Debug Data
            </button>
        </details>
    </main>

    <footer>
        <div class="footer-links">
            <a href="https://github.com/cbangera2/BudgetLens" target="_blank">BudgetLens</a>
            <a href="https://github.com/cbangera2/CreditKarmaExtractor" target="_blank">GitHub</a>
            <a href="https://github.com/cbangera2/CreditKarmaExtractor/issues" target="_blank">Report an issue</a>
        </div>
        <div class="footer-meta">
            <p>v2.2 • &copy; 2026 Chirag Bangera</p>
        </div>
    </footer>

    <div class="action-bar">
        <button id="export-btn" class="primary-btn">Export Selected Data</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
