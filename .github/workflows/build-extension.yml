name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js

      - name: Run tests
        run: node --test

  package:
    name: Package extension
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create extension archive
        run: >-
          zip -X extension.zip
          manifest.json content.js background.js popup.html popup.css popup.js
          icon.png README.md

      - name: Verify archive integrity
        run: |
          unzip -t extension.zip
          sha256sum extension.zip > extension.zip.sha256

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credit-karma-extractor
          path: |
            extension.zip
            extension.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
